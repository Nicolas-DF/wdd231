<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradiente Principal (Primary Blue para Dark Blue) -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Gradiente Secundário (Light Blue para Primary Blue) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Sombra suave profissional -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E3A8A" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Fundo Limpo e Arredondado (#F3F4F6) -->
  <rect width="500" height="500" rx="48" fill="#F3F4F6"/>

  <!-- Ícone / Símbolo Centralizado -->
  <g filter="url(#softShadow)">
    <!-- Camada 1: Folha de Impressão Posterior (#1E3A8A) -->
    <path d="M 170 120 L 310 120 C 340 120, 360 140, 360 170 L 360 310 C 360 340, 340 360, 310 360 L 170 360 C 140 360, 120 340, 120 310 L 120 170 C 120 140, 140 120, 170 120 Z" 
          fill="#1E3A8A" 
          transform="rotate(-12 240 240)" 
          opacity="0.9"/>

    <!-- Camada 2: Folha de Impressão Central com Gradiente (#2563EB) -->
    <path d="M 180 130 L 320 130 C 350 130, 370 150, 370 180 L 370 320 C 370 350, 350 370, 320 370 L 180 370 C 150 370, 130 350, 130 320 L 130 180 C 130 150, 150 130, 180 130 Z" 
          fill="url(#primaryGrad)" 
          transform="rotate(6 250 250)"/>

    <!-- Elementos do Gráfico de Barras / Impressão -->
    <rect x="180" y="270" width="24" height="50" rx="6" fill="#DBEAFE" transform="rotate(6 250 250)"/>
    <rect x="216" y="230" width="24" height="90" rx="6" fill="url(#accentGrad)" transform="rotate(6 250 250)"/>
    <rect x="252" y="180" width="24" height="140" rx="6" fill="#FFFFFF" transform="rotate(6 250 250)"/>

    <!-- Marca de Registro de Impressão / Vetor -->
    <g transform="translate(305, 205)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <circle cx="0" cy="0" r="8" fill="#DBEAFE"/>
      <line x1="-24" y1="0" x2="24" y2="0" stroke="#FFFFFF" stroke-width="2.5"/>
      <line x1="0" y1="-24" x2="0" y2="24" stroke="#FFFFFF" stroke-width="2.5"/>
    </g>
  </g>
</svg>
